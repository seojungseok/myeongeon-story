name: Daily auto-generated stories

# 매일 새 이야기를 OpenAI(GPT-5.6 Luna)로 생성해 커밋 → Vercel 자동 배포.
# 컴퓨터가 꺼져 있어도 GitHub 서버에서 실행됩니다.
#
# --auto 모드: 명언 목록 파일에 의존하지 않고, AI가 매 실행마다 실존 유명 인물의
# "진짜" 명언을 새로 골라옵니다(이미 쓴 명언은 자동 제외). 목록이 소진될 일이 없어
# 매일 계속 생성됩니다. scripts/quotes.txt를 다시 채울 필요가 없습니다.
#
# --focus: 특정 테마로 집중 생성. 현재는 관심 높은 "그리움·사랑·이별(헤어짐)"을
# 우선 채우는 중(FOCUS 기본값 longing,love). 충분히 쌓이면 아래 FOCUS를 빈 값으로
# 두면 다시 전체 주제로 다양하게 생성됩니다. 수동 실행 시 focus 칸으로 그때그때 지정 가능.
#
# 사전 설정 (1회):
#   GitHub 저장소 → Settings → Secrets and variables → Actions → New repository secret
#     Name: OPENAI_API_KEY   Value: (platform.openai.com/api-keys 에서 발급)
#   (선택) 모델 바꾸려면 아래 env의 OPENAI_MODEL 수정.
#   (나중에 Gemini로 되돌리려면) env에서 AI_PROVIDER: gemini + GEMINI_API_KEY secret 사용.

on:
  schedule:
    - cron: "0 21 * * *" # 매일 21:00 UTC = 한국 06:00
  workflow_dispatch: # 수동 실행 버튼도 제공
    inputs:
      count:
        description: "생성할 이야기 수 (하루 기본 5, 대량 채우기는 40~60 권장)"
        default: "5"
      focus:
        description: "집중 테마 슬러그(쉼표구분, 예: longing,love). 비우면 전체 주제"
        default: "longing,love"

permissions:
  contents: write

concurrency:
  group: daily-stories
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - run: npm ci

      - name: Generate stories
        env:
          AI_PROVIDER: openai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: gpt-5.6-luna
        run: |
          ARGS="--auto --count ${{ github.event.inputs.count || '5' }}"
          FOCUS="${{ github.event.inputs.focus || 'longing,love' }}"
          if [ -n "$FOCUS" ]; then ARGS="$ARGS --focus $FOCUS"; fi
          echo "running: gen:story -- $ARGS"
          npm run gen:story -- $ARGS

      - name: Commit & push if there are new stories
        run: |
          git config user.name "myeongeon-bot"
          git config user.email "actions@github.com"
          if [ -n "$(git status --porcelain src/content/stories)" ]; then
            git add src/content/stories
            git commit -m "chore: daily auto-generated stories ($(date -u +%Y-%m-%d))"
            git push
            echo "pushed new stories."
          else
            echo "no new stories (pool may be exhausted — add more to scripts/quotes.txt)."
          fi
